<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="540" viewBox="0 0 1600 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>株式会社ルーキースマートジャパン Apex Signal transparent homepage banner</title>
  <desc>背景透過版。ホームページやヒーロー上に重ねて使うための横長ロゴ。</desc>
  <defs>
    <linearGradient id="text-04-apex-signal-home-transparent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="0.58" stop-color="#b9d3ff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <linearGradient id="mark-04-apex-signal-home-transparent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="0.48" stop-color="#b9d3ff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <radialGradient id="glow-04-apex-signal-home-transparent" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4d9cff" stop-opacity="0.42"/>
