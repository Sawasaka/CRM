    <circle cx="266" cy="250" r="65.52" fill="url(#glow-04-apex-signal-home-transparent)" filter="url(#soft-04-apex-signal-home-transparent)"/>
    <path d="M 225.44 274.96 L 266 211 L 307.25 274.96" fill="none" stroke="url(#mark-04-apex-signal-home-transparent)" stroke-width="11.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 241.04 274.96 L 266 241.36 L 290.96 274.96" fill="none" stroke="#f8fbff" stroke-width="6.24" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
