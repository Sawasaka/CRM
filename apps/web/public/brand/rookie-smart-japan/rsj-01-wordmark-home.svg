<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">株式会社ルーキースマートジャパン ホームページ用ロゴ案 01</title>
  <desc id="desc">既存のルキスマCRMワードマークを会社ロゴとして整えた横長ビジュアル。</desc>
  <defs>
    <radialGradient id="rsj01HomeBgA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(524 278) rotate(18) scale(720 340)">
      <stop stop-color="#17263A"/>
      <stop offset="0.58" stop-color="#111418"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </radialGradient>
    <linearGradient id="rsj01HomeText" x1="342" y1="214" x2="1248" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#ABC7FF"/>
      <stop offset="1" stop-color="#0071E3"/>
    </linearGradient>
    <filter id="rsj01HomeGlow" x="-40%" y="-90%" width="180%" height="280%" color-interpolation-filters="sRGB">
