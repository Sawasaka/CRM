      <stop offset="0.62" stop-color="#eef8fd"/>
      <stop offset="1" stop-color="#d8effb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 102) rotate(124) scale(430)">
      <stop stop-color="#47b1ed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#47b1ed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
